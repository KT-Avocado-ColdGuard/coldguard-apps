<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVOCADO HOSPITAL 현장 웹</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#21362a;font-family:'Malgun Gothic',sans-serif}header{padding:20px 4%;border-bottom:1px solid #ccd7c8;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:25px;margin:0}main{padding:24px 4%;max-width:1600px;margin:auto}.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit;padding:10px;border:1px solid #687c66}button{cursor:pointer;background:#bce7f6;font-weight:bold}button:disabled{cursor:not-allowed;opacity:.5}.layout{display:grid;grid-template-columns:180px minmax(250px,1fr) minmax(320px,460px);gap:30px;margin-top:24px}.doors{display:flex;flex-direction:column;justify-content:center;gap:28px}.round{border-radius:50%;aspect-ratio:1;background:#bde98d;border:3px solid #557340;font-size:22px}.freezer{text-align:center;min-width:0}.meter{background:#111c16;color:white;padding:18px;border:5px solid #414d43}.temp{font-size:48px}.target{color:#ff7676;margin-top:8px}.fridge{display:block;border:0;background:none;width:100%;padding:12px}.fridge img{max-height:55vh;max-width:100%;object-fit:contain}.box{background:white;border:3px solid #50624c;padding:22px;margin-bottom:18px}.site{text-align:center;font-size:28px;font-weight:bold}.state{cursor:pointer;line-height:1.9}.early{background:#fff2bc}.hot{background:#ff9696}.stale{background:#eee}.hot-bg{background:#ffabab}.early-bg{background:#ffe5e5}h2{font-size:24px;margin:0 0 10px}.eta{color:#c42323;font-weight:bold}p{overflow-wrap:anywhere}.note{color:#647161;font-size:14px}form{display:flex;gap:8px;flex-wrap:wrap}input{width:130px}.notice{min-height:30px;font-weight:bold}dialog{background:#fff;color:#21362a;border:1px solid #53664c;width:min(1100px,94vw);max-height:85vh;padding:24px}dialog::backdrop{background:#0007}.dialog-head{display:flex;align-items:center;justify-content:space-between}.table{overflow:auto;max-height:60vh}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd;white-space:pre-wrap;overflow-wrap:anywhere}th{background:#eef4ec}.command{font-size:14px;border-top:1px solid #ccd7c8;padding:10px 0}.blocked{color:#ae1919;font-weight:bold}@media(max-width:900px){.layout{grid-template-columns:1fr}.doors{flex-direction:row}.round{width:125px}.fridge img{max-height:40vh}}

/* 시뮬레이터와 같은 중앙 정렬, 화면 높이에 비례하는 크기 */
body{height:100dvh;overflow:hidden}header{height:64px;padding:12px 3.6%;flex-wrap:nowrap}h1{font-size:25px;letter-spacing:2px}header span{display:none}main{height:calc(100dvh - 64px);max-width:none;padding:8px 3.6% 16px;display:flex;flex-direction:column}.bar{min-height:42px;flex-wrap:nowrap;font-size:14px}.notice{margin:0;min-height:0}.layout{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-top:8px}.freezer{grid-column:2;display:flex;flex-direction:column;align-items:center;min-height:0}.meter{width:min(100%,480px);flex:none;padding:12px;border:5px solid #39433b}.temp{font-family:monospace;font-size:clamp(30px,6vh,56px)}.target{font-size:20px}.fridge{flex:1;min-height:0;width:100%;padding:12px 0 0}.fridge img{height:100%;max-height:100%;max-width:100%;object-fit:contain}.doors{align-items:flex-start;justify-content:center;gap:5vh}.round{width:clamp(90px,18vh,156px);height:clamp(90px,18vh,156px);flex:none;font-size:clamp(16px,2.7vh,23px);color:#21362a}.round:disabled{background:#c8d0c2;border-color:#8ca383;opacity:1;color:#7e8b78}aside{justify-self:end;width:92%;max-width:380px;min-height:0;overflow:auto}.box{padding:18px;margin-bottom:16px}.site{font-size:30px}.state{line-height:1.8}h2{font-size:24px}.state p{font-size:16px;margin:16px 0}.note{font-size:13px}#detail{white-space:pre-line}#locked{width:auto}#commands{max-height:18vh;overflow-y:auto;overflow-wrap:anywhere}.command{margin:4px 0;color:#68716c}.command.blocked{color:#c51d1d;font-weight:bold}.log-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}.search{margin-left:auto;display:flex;gap:8px;align-items:center}.search input{width:150px}.search input[type=datetime-local]{width:240px}.search select{max-width:300px}dialog{width:min(1100px,94vw)}
@media(max-height:750px){.box{padding:12px;margin-bottom:10px}.site{font-size:25px}.state p{margin:8px 0}h2{font-size:21px}.meter{padding:8px}.target{font-size:17px}}
@media(max-width:800px){body{height:auto;overflow:auto}main{height:auto}.layout{display:flex;flex-wrap:wrap}.doors{width:22%;flex-direction:column}.freezer{width:78%;height:65vh}aside{width:100%;max-width:none}.bar{flex-wrap:wrap}.search{flex-wrap:wrap}}
</style></head><body data-csrf='{{csrf|tojson}}' data-control='{{control|tojson}}' data-door='{{door|tojson}}'>
<header><h1>AVOCADO HOSPITAL 현장</h1><span>시설 상태 / 제어 요청 / 현장 기록</span></header>
<main><div class="bar"><label>냉동고 <select id="device">{% for d in devices %}<option>{{d}}</option>{% endfor %}</select></label><span id="connection">연결 확인 중</span><p id="notice" class="notice" role="status" aria-live="polite"></p></div>
<div class="layout"><section class="doors" aria-label="문 조작"><button class="round" id="open" disabled>Door<br>Open</button><button class="round" id="close" disabled>Door<br>Closed</button></section>
<section class="freezer"><div class="meter"><div class="temp" id="temp">— °C</div><div class="target" id="target">설정 온도 확인 중</div></div><button class="fridge" id="image" aria-label="냉동고 기록 열기"><img id="photo" src="/image/door_closed.png" alt="냉동고 — 상태 확인 중"></button></section>
<aside><div class="box site">시설 {{site}} 현장</div><div class="box state" id="statebox" role="button" tabindex="0" aria-label="현장 로그 열기"><h2 id="state">데이터 확인 중</h2><strong id="reason"></strong><p id="detail"></p><p class="eta" id="eta"></p><span class="note">클릭하면 측정 / 경보 / 명령 로그를 확인합니다.</span></div>
<div class="box"><h2>현장 잠금</h2><label><input id="locked" type="checkbox" role="switch" disabled> AWS 원격 온도 변경 차단</label><p class="note">잠금 중에도 문 열기 / 닫기는 가능합니다. 표시 상태는 controller가 기록한 확인 결과입니다.</p><div id="commands"></div></div>
</aside></div>{% if not door %}<p class="note">문 조작은 전용 토픽과 시뮬레이터 수신 기능 연동 후 활성화됩니다.</p>{% endif %}</main>
<dialog id="logs"><div class="dialog-head"><h2>냉동고 현장 기록</h2><button id="dismiss" aria-label="닫기">×</button></div><div class="log-tools"><label>기록 종류 <select id="kind"><option value="measurements">측정</option><option value="alarms">경보</option><option value="commands">명령 처리</option></select></label><form id="search" class="search"><select id="filter" aria-label="검색 항목"></select><span id="query"></span><button type="submit">검색</button></form></div><p id="lognote"></p><div class="table"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></dialog>
<script>
const $=id=>document.getElementById(id);
const csrf=JSON.parse(document.body.dataset.csrf);
const control=JSON.parse(document.body.dataset.control);
const doorEnabled=JSON.parse(document.body.dataset.door);
let busy=false, generation=0;
const states={normal:'정상 운전',early:'온도가 위험 수준까지 상승하고 있습니다!',hot:'고온 경보 - 위험 온도 도달',stale:'데이터 확인 불가'};
const statuses={accepted:'적용',approved:'승인 / 적용 대기',sent:'장비 전달 / 응답 대기',applied:'적용',blocked:'차단',rejected:'차단',unconfirmed:'적용 여부 미확인',received:'수신'};
const reasons={locked:'현장 잠금',out_of_range:'허용 온도 범위 초과',duplicate:'중복 명령',unknown_device:'대상 장비 불일치',apply_timeout:'적용 응답 시간 초과',target_out_of_range:'허용 온도 범위 초과',expired:'명령 만료',wrong_target:'시설 또는 장비 불일치',device_rejected:'차단',invalid_issued_at:'발급 시각 오류',future_issued_at:'발급 시각이 미래',invalid_lifetime:'유효기간 오류',device_confirmed:'장비 적용 확인'};
function date(v){return v?new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'—'}
function temp(v){return typeof v==='number'?v.toFixed(1)+' °C':'—'}
function path(p){return p+'?device='+encodeURIComponent($('device').value)}
async function api(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});const data=await r.json();if(!r.ok)throw new Error((data.error||'요청 실패')+(data.cmd_id?' / 명령 ID : '+data.cmd_id:''));return data}
function off(){for(const id of ['open','close','locked'])$(id).disabled=true}
function render(data){const s=data.state, mqtt=data.mqtt, last=data.commands[0], blocked=last&&['blocked','rejected'].includes(last.status);const warm=s?.status==='early'&&s.temp>-27;document.body.className=s?.status==='hot'?'hot-bg':warm?'early-bg':'';
 $('connection').textContent='MQTT : '+(mqtt.connected?(mqtt.subscribed?'연결 / 구독 확인':'연결 / 구독 미확인'):'연결 안 됨');
 $('temp').textContent=temp(s?.temp);$('target').textContent='설정 '+temp(s?.target);
 $('state').textContent=!s||s.status==='stale'?'State : 확인 불가':s.status==='hot'?'State : 비정상':'State : 정상';
 $('statebox').className='box state '+(s?.status==='early'&&!warm?'normal':s?.status||'stale');$('reason').textContent=s&&s.status!=='stale'&&s.temp<=-27?'정상적으로 운영 중입니다.':states[s?.status]||'수집된 데이터가 없습니다.';

 $('detail').textContent=s?'장비 : '+data.device+'\n문 : '+(s.door?'열림':'닫힘')+'\n냉각 : '+(s.cooling?'가동':'대기')+'\n마지막 측정 : '+date(s.stamp):'장비 : '+data.device;
 $('eta').textContent=s?.status==='early'&&s.eta!=null?'위험 온도까지 예상 : '+Math.max(0,Math.ceil(s.eta))+'초':'';
 $('photo').src=s?.door?'/image/door_open.png':'/image/door_closed.png';$('photo').alt=s?'냉동고 문 '+(s.door?'열림':'닫힘'):'냉동고 — 상태 확인 불가';
 $('locked').disabled=busy||!control||!mqtt.connected;$('locked').checked=!!data.locked;$('open').disabled=busy||!control||!doorEnabled||!mqtt.connected||!s||s.status==='stale'||s.door;$('close').disabled=busy||!control||!doorEnabled||!mqtt.connected||!s||s.status==='stale'||!s.door;
 $('commands').replaceChildren();for(const cmd of data.commands.slice(0,5)){const el=document.createElement('p');el.className='command '+(['blocked','rejected'].includes(cmd.status)?'blocked':'');el.textContent=(statuses[cmd.status]||cmd.status)+' / 요청 : '+temp(cmd.request.target)+' / '+(reasons[cmd.result?.reason]||cmd.result?.reason||(['accepted','applied'].includes(cmd.status)?'적용 완료':'처리 대기'))+' / ID : '+cmd.cmd_id;$('commands').append(el)}}
async function refresh(){const gen=generation;try{const d=await api(path('/api/state'));if(gen===generation)render(d)}catch(e){if(gen===generation){off();$('state').textContent='State : 확인 불가';$('reason').textContent=e.message;$('connection').textContent='DB 조회 실패';document.body.className='';$('statebox').className='box state stale'}}}
async function submit(body){if(busy)return;busy=true;off();try{const d=await api(path('/api/command'),{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});$('notice').textContent=d.message}catch(e){$('notice').textContent=e.message}finally{busy=false;await refresh()}}
$('locked').onchange=()=>submit({action:'lock',locked:$('locked').checked});$('open').onclick=()=>submit({action:'door',open:true});$('close').onclick=()=>submit({action:'door',open:false});
// 검색은 현재 장비의 최근 500건을 대상으로 한다. 범위를 화면에 명시한다.
let logRows=[], logRequest=0;
const fields={measurements:[['stamp','시각'],['temp','온도'],['target','설정 온도'],['door','문 상태']],alarms:[['stamp','시각'],['reason','내용'],['temp','온도']],commands:[['stamp','시각'],['cmd_id','명령 ID'],['status','결과'],['target','요청 온도'],['reason','사유']]};
function options(el,items){el.replaceChildren();for(const [value,label] of items){const o=document.createElement('option');o.value=value;o.textContent=label;el.append(o)}}
function queryInput(){const key=$('filter').value, box=$('query');box.replaceChildren();
 const input=(type,id,placeholder)=>{const e=document.createElement('input');e.type=type;e.id=id;e.placeholder=placeholder;e.setAttribute('aria-label',placeholder);if(type==='number')e.step='any';box.append(e);return e};
 if(key==='stamp'){input('datetime-local','q','검색 시각 (한국 시간)');return}
 if(key==='temp'){input('number','q','최저 온도');box.append(' ~ ');input('number','qmax','최고 온도');return}
 if(key==='target'||key==='cmd_id'){input(key==='target'?'number':'text','q','입력');return}
 const e=document.createElement('select');e.id='q';e.setAttribute('aria-label','검색 값');box.append(e);
 const items=key==='door'?[['true','열림'],['false','닫힘']]:[...new Set(logRows.map(r=>r[key]).filter(v=>v!=null))].map(v=>[v,key==='status'?(statuses[v]||v):(reasons[v]||v)]);
 options(e,[['','전체'],...items]);}
function drawLogs(){const kind=$('kind').value,key=$('filter').value,q=$('q')?.value||'',max=$('qmax')?.value||'';
 if(key==='temp'&&q!==''&&max!==''&&Number(q)>Number(max)){$('lognote').textContent='최저 온도는 최고 온도보다 높을 수 없습니다.';return}
 const rows=logRows.filter(r=>{if(q===''&&max==='')return true;if(key==='temp')return r.temp!=null&&(q===''||r.temp>=Number(q))&&(max===''||r.temp<=Number(max));if(key==='target')return r.target!=null&&r.target===Number(q);if(key==='stamp'){const start=Date.parse(q+':00+09:00');return Date.parse(r.stamp)>=start&&Date.parse(r.stamp)<start+60000}return String(r[key])===q});
 const cols=kind==='measurements'?[['stamp','시각'],['temp','현재 온도'],['target','설정 온도'],['door','문']]:kind==='alarms'?[['stamp','시각'],['reason','내용'],['temp','온도'],['eta','예상 시간']]:[['stamp','시각'],['cmd_id','명령 ID'],['status','결과'],['target','요청 온도'],['reason','사유']];
 $('head').replaceChildren();$('rows').replaceChildren();const h=document.createElement('tr');for(const [k,label]of cols){const th=document.createElement('th');th.textContent=label;h.append(th)}$('head').append(h);
 for(const row of rows){const tr=document.createElement('tr');for(const [key]of cols){const td=document.createElement('td');td.textContent=key==='stamp'?date(row[key]):key==='door'?(row[key]?'열림':'닫힘'):key==='status'?(statuses[row[key]]||row[key]):key==='reason'?(reasons[row[key]]||row[key]||'—'):String(row[key]??'—');tr.append(td)}$('rows').append(tr)}
 $('lognote').textContent='검색 결과 '+rows.length+'건 / 최근 '+logRows.length+'건 내 검색 (최대 500건) / 시각은 한국 시간 기준 해당 1분';}
async function loadLogs(){const ticket=++logRequest,gen=generation,kind=$('kind').value;logRows=[];$('rows').replaceChildren();$('lognote').textContent='조회 중';try{const d=await api(path('/api/logs')+'&kind='+kind+'&limit=500');if(ticket!==logRequest||gen!==generation)return;logRows=d.rows;options($('filter'),fields[kind]);queryInput();drawLogs()}catch(e){$('lognote').textContent=e.message}}
$('filter').onchange=queryInput;$('search').onsubmit=e=>{e.preventDefault();drawLogs()};
function showLogs(){$('logs').showModal();loadLogs()}$('statebox').onclick=showLogs;$('statebox').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showLogs()}};$('image').onclick=showLogs;$('dismiss').onclick=()=>$('logs').close();$('kind').onchange=loadLogs;$('device').onchange=()=>{generation++;off();$('notice').textContent='';refresh()};
(async function poll(){await refresh();setTimeout(poll,1000)})();
</script></body></html>
