name: Image Scan
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional tag; empty discovers all tags independently per image'
        default: ''
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.tags.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Discover public tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          mkdir -p reports
          set -o pipefail
          python3 ci/tags.py 2>&1 | tee reports/discovery.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tag-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
  audit:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize audit evidence
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/audit-code-commit.txt
          date -u +%FT%TZ > reports/started-at.txt
          printf '%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > reports/run-url.txt
      - name: Pull published image and record immutable identity
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          SERVICE: ${{ matrix.service }}
        run: bash ci/pull.sh
      - name: Install pinned Trivy
        run: |
          set -o pipefail
          (
            set -e
            curl --fail --location --retry 3 -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
            curl --fail --location --retry 3 -o /tmp/checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_checksums.txt
            cd /tmp
            cp trivy.tar.gz trivy_0.76.0_Linux-64bit.tar.gz
            grep ' trivy_0.76.0_Linux-64bit.tar.gz$' checksums.txt > selected-checksum.txt
            test -s selected-checksum.txt
            sha256sum -c selected-checksum.txt
            tar -xzf trivy.tar.gz trivy
            sudo install trivy /usr/local/bin/trivy
          ) 2>&1 | tee reports/trivy-install.log
      - name: Scan pulled image by local immutable ID
        run: bash ci/scan.sh "$(cat reports/image-id.txt)"
      - name: Enforce image-specific policy
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -o pipefail
          python ci/gate.py reports/trivy-full.json "ci/security/published/$SERVICE.json" "$(cat reports/image-id.txt)" reports/gate.json 2>&1 | tee reports/gate.log
      - name: Preserve audit evidence
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p reports
          date -u +%FT%TZ > reports/finished-at.txt
          cp "ci/security/published/$SERVICE.json" reports/exceptions.json
          if [ ! -s reports/trivy-full.json ]; then
            echo 'Scan did not produce a report; not a clean scan.' > reports/scan-unavailable.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-${{ matrix.service }}-${{ matrix.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 90
          if-no-files-found: error
