name: ColdGuard CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: coldguard-ci-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Initialize evidence
        run: |
          mkdir -p reports
          date -u +%FT%TZ > reports/started-at.txt
          git rev-parse HEAD > reports/source-commit.txt
          printf '%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > reports/run-url.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and synthetic policy tests (no production connections)
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.log
      - name: Build shared facility image
        run: |
          set -euo pipefail
          docker build --provenance=false --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -f Dockerfile -t "coldguard:$GITHUB_SHA" . 2>&1 | tee reports/build.log
          docker image inspect "coldguard:$GITHUB_SHA" --format '{{.Id}}' > reports/image-id.txt
      - name: Install pinned Trivy
        run: |
          set -o pipefail
          (
            set -e
            curl --fail --location --retry 3 -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
            curl --fail --location --retry 3 -o /tmp/checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_checksums.txt
            cd /tmp
            cp trivy.tar.gz trivy_0.76.0_Linux-64bit.tar.gz
            grep ' trivy_0.76.0_Linux-64bit.tar.gz$' checksums.txt > selected-checksum.txt
            test -s selected-checksum.txt
            sha256sum -c selected-checksum.txt
            tar -xzf trivy.tar.gz trivy
            sudo install trivy /usr/local/bin/trivy
          ) 2>&1 | tee reports/trivy-install.log

      - name: Scan shared image and enforce policy
        run: |
          set -euo pipefail
          bash ci/scan.sh "$(cat reports/image-id.txt)"
          python ci/gate.py reports/trivy-full.json ci/security/exceptions.json "$(cat reports/image-id.txt)" reports/gate.json 2>&1 | tee reports/gate.log

      - name: Validate AWS settings
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]

      - name: Authenticate to AWS using OIDC
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: coldguard-ci-${{ github.run_id }}

      - name: Publish approved image to ECR repositories
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: bash ci/publish.sh

      - name: Preserve evidence even on failure
        if: always()
        run: |
          set -euo pipefail

          mkdir -p reports
          date -u +%FT%TZ > reports/finished-at.txt
          cp ci/security/exceptions.json reports/exceptions.json

          if [ ! -s reports/trivy-full.json ]; then
            echo 'Scan unavailable; not a clean scan.' > reports/scan-unavailable.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 90
          if-no-files-found: error

  notify:
      name: Notify Discord
      needs: test-build-scan
      if: always()
      runs-on: ubuntu-24.04
      timeout-minutes: 5

      permissions:
        contents: read

      steps:
        - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
          with:
            persist-credentials: false
            ref: main

        - name: Check trusted notification script
          id: notification
          env:
            EVENT_NAME: ${{ github.event_name }}
          run: |
            if [ -f ci/discord.py ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
            elif [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Discord notification skipped: ci/discord.py is not yet on main."
              echo "Discord notification skipped because the trusted script is not yet on main." >> "$GITHUB_STEP_SUMMARY"
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Trusted notification script ci/discord.py is missing on main."
              exit 1
            fi

        - name: Send CI result
          if: steps.notification.outputs.ready == 'true'
          env:
            DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
            CI_RESULT: ${{ needs.test-build-scan.result }}
            EVENT_NAME: ${{ github.event_name }}
            REF: ${{ github.ref }}
            SOURCE_SHA: ${{ github.sha }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run: python3 ci/discord.py
